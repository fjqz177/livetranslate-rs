[package]
name = "lt-ui"
version.workspace = true
edition.workspace = true

[dependencies]
lt-proto = { workspace = true }
lt-i18n = { workspace = true }
# 面板：模型缓存探测/注册表（lt-models）+ 设备枚举（lt-pipeline 的 AudioBackend）
lt-models = { workspace = true }
lt-pipeline = { workspace = true }
# 翻译页 prompt 预设 + 性能基准独立窗（lt_translate::bench 直调）
lt-translate = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
egui-winit = { workspace = true }
egui-wgpu = { workspace = true }
winit = { workspace = true }
raw-window-handle = "0.6"
tray-icon = { workspace = true }
muda = { workspace = true }
image = { workspace = true }
rfd = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
sysinfo = { workspace = true }
# 内嵌字体 brotli 解压（纯 Rust；启动一次性）
brotli = "7"

[dev-dependencies]
# 字形覆盖断言用（与 epaint 同栈同版本；仅测试，不进 exe）
skrifa = "0.44"

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging", # 穿透轮询（GetCursorPos/EXSTYLE）
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",        # 常规页：开机自启（HKCU Run 键）
    # ── 原生通知（D-33/H-2，docs/hide-quit-flow-overhaul.md 附录 B）──
    "UI_Notifications",               # ToastNotificationManager/ToastNotifier
    "Data_Xml_Dom",                   # XmlDocument::LoadXml（Toast XML 装配）
    "Win32_UI_Shell",                 # IShellLinkW/ShellLink GUID/SetCurrentProcessExplicitAppUserModelID
    "Win32_UI_Shell_PropertiesSystem",# IPropertyStore（System.AppUserModel.ID 写入）
    "Win32_Storage_EnhancedStorage",  # PKEY_AppUserModel_ID
    "Win32_Storage_FileSystem",       # GetFileAttributesW（.lnk 存在性探测）
    "Win32_System_Com",               # CoCreateInstance/IPersistFile
    "Win32_System_Com_StructuredStorage", # PROPVARIANT
    "Win32_System_Variant",           # PROPVARIANT union + VT_LPWSTR（0.62 门控）
    "Win32_System_WinRT",             # RoInitialize（winit 已 STA → RO_INIT_SINGLETHREADED）
] }
