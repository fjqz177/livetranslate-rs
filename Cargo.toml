[workspace]
resolver = "2"
members = [
    "crates/lt-proto",
    "crates/lt-i18n",
    "crates/lt-models",
    "crates/lt-audio",
    "crates/lt-asr",
    "crates/lt-translate",
    "crates/lt-orchestrator",
    "crates/lt-download",
    "crates/lt-ui",
    "crates/lt-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false            # 内部 workspace：禁误发布；同时让 cargo-deny 的 private 语义成立

[workspace.dependencies]
lt-proto = { path = "crates/lt-proto" }
lt-i18n = { path = "crates/lt-i18n" }
lt-models = { path = "crates/lt-models" }
lt-audio = { path = "crates/lt-audio" }
lt-asr = { path = "crates/lt-asr" }
lt-translate = { path = "crates/lt-translate" }
lt-orchestrator = { path = "crates/lt-orchestrator" }
lt-download = { path = "crates/lt-download" }
lt-ui = { path = "crates/lt-ui" }

# ── 同步（W2/W4 设置+监视快照格；读者全为同步线程、写者 <1Hz）──
arc-swap = "1"

# ── GUI ──
egui = "0.36"
egui-winit = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }
winit = "0.30"

# ── Win32 互操作 ──
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",      # worker 孤儿兜底（E-05）
    "Win32_Storage_FileSystem",
] }

# ── 托盘 ──
tray-icon = "0.24"
muda = "0.19"

# ── 原生文件对话框（导出/本地模型路径选择）──
rfd = "0.15"

# ── 图标 PNG 解码（托盘/窗口图标；仅 png feature）──
image = { version = "0.25", default-features = false, features = ["png"] }

# ── 音频 ──
wasapi = "0.24"

# ── 推理 ──
ort = { version = "2.0.0-rc.13", default-features = false, features = ["ndarray", "load-dynamic"] }
sherpa-onnx = "1.13"
whisper-rs = "0.16"

# ── LLM / 网络 ──
# 0.41 的 default 仅含 rustls，_api（Client/chat）与 chat-completion 需显式开启
async-openai = { version = "0.41", default-features = false, features = ["rustls", "_api", "chat-completion", "byot"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "stream", "json", "gzip", "blocking"] }

# ── 异步 ──
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "process", "signal", "sync"] }

# ── 序列化 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# ── 系统/工具 ──
sysinfo = "0.39"
sys-locale = "0.3"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
parking_lot = "0.12"
crossbeam-channel = "0.5"
pollster = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 2
panic = "unwind"
