# GitHub Actions 版本自动更新（D-88 决策 G-b，necessity review 收窄后的定稿）
#
# 只做一件事：让 .github/workflows/ 里的 action 版本（含 SHA 钉版，dependabot 支持更新
# SHA+版本注释）以 PR 形式送到眼前。
#
# 收窄记录：原推荐 cargo + github-actions 双生态 weekly，necessity review 判其为全家桶
# 最弱一环（删之无硬能力损失 + 与主干直推摩擦 + 17 高星仓近半没有 dependabot），
# 收敛为 tokio 式只盯 actions 生态。cargo 依赖升级走手动 `cargo update`（security.yml
# 盯 CVE 兜底）；rust-toolchain.toml 升级手动改号（见该文件头注流程）。
#
# PR 与 checks（D-89 回摆后已闭环）：ci.yml 恢复 pull_request 触发后，dependabot PR 自身
# 就挂上全量 CI checks（此前只有「分支 push 命中全分支触发」那一次）；合并进 main 仍再跑一次。
#
# cargo 依赖的安全面（人工面）：本文件只管 actions 版本。cargo 依赖的自动提醒来自仓库设置里的
# Dependabot alerts / security updates（本仓当前未开——复审实测 2026-09-15；公开仓免费、
# 开了才有 CVE 自动 PR）；版本升级依旧手动 `cargo update` + 全量测试（节奏建议随 actions 月更同周末）。
#
# cooldown 7 天：新版发布冷却一周再开 PR（meili/fd 式），压缩上游投毒窗口；
# 对 actions 生态的实际生效有上游未关 issue 报怨，首个 PR 到达时核实间隔。

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
