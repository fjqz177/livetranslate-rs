# LiveTranslate-rs 发布流水线 —— 薄编排（D-90）
# 草稿期两份（docs/drafts/*）已转正到这里：本文件 + scripts/release.ps1 成对维护——改引擎动词
# 或改本文件都要一起想一遍。
#
# 所有发布逻辑都在 scripts/release.ps1（本地与 CI 同一份引擎），本文件只做四件事：
#   ① 按序调引擎动词：check → build → pack →［tag 通道］draft → verify
#   ② 铺环境（工具链 + 缓存四步，与 ci.yml 镜像）
#   ③ 用 artifact 把 dist/ 从构建 job 交给发布 job
#   ④ 手动触发时在运行摘要里写明「没发布任何东西」
#
# 什么情况才会真的发布（对外可见 = 三关全过 + 一个只有人能做的动作）：
#   1) 推送 v 开头的 tag（如 v0.1.0）——本 workflow 只认 tag 推送，其他 push 一律不触发
#   2) check 全绿：tag 名 = Cargo.toml 版本（只发正式版 x.y.z，预发布不支持）/ 提交在 main / 该提交 ci 已绿
#   3) draft + verify 全绿 → 产物只是一份【草稿】（未登录的人看不到）
#   4) 人在 Releases 页面点 Publish release（或本机 promote）→ 此刻才对外可见
#   CI 没有任何一步能发布：唯一会发布（promote）的动词根本不在本文件里——这是刻意的，不是遗漏。
#
# 两个入口：
#   打 tag 推送      正式：全链跑完 → Releases 里多一份草稿（转正仍人工）
#   Actions 手动触发  演练：只跑 check → build → pack，不产生任何 Release（publish job 不启动）
#
# GitHub 网页入口：Actions → 左侧 release = 运行列表（Run workflow 按钮 = 演练）；Releases = 草稿与发布
# 本地等价路径：pwsh -File scripts/release.ps1 release（同引擎、同产物、同校验）
name: release
# 运行列表里一眼分清两种运行：正式（发布 vX.Y.Z）/ 演练
run-name: ${{ github.event_name == 'push' && format('发布 {0}', github.ref_name) || '演练（手动触发·不会发布）' }}

on:
  push:
    tags: ['v[0-9]*']           # 只认 v+数字开头的 tag（vault-xxx 之类不会被拉进来）
  workflow_dispatch:            # 演练通道（引擎自动识别，禁一切发布动作）

permissions:
  contents: read                # 各 job 按需提权

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false     # 发布链不许半路自杀

jobs:
  build:
    name: 检查 → 构建 → 打包（不碰 Release）
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read             # 引擎 check ④ 要读 ci 运行记录
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 闸门放在最前面：坏 tag / ci 未绿约 1 分钟就红，不白等十几分钟构建
      - name: 引擎 · check（版本 / 工作区 / 主线 / ci 绿 / 构建前置）
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 check

      # 工具链/缓存四步与 ci.yml 镜像——改动须两文件同步（三次法则：第三处出现再抽 composite action）
      - name: Setup uv（仓库内 libclang/cmake 分发器）
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Sync pinned toolchain (libclang + cmake via uv)
        run: uv sync --locked

      - name: Cache sherpa-onnx prebuilt libs
        uses: actions/cache@v6
        with:
          path: .cache/sherpa-onnx
          key: sherpa-${{ hashFiles('Cargo.lock') }}
          restore-keys: sherpa-

      - name: Fetch sherpa-onnx libs
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/fetch_sherpa_libs.ps1

      - name: Cache Rust build (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: lt      # 与 ci.yml 同稳定键：吃主干缓存，防每个 tag 全冷构建

      - name: 引擎 · build（编译 → 冒烟 → 内嵌版本自检）
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 build

      - name: 引擎 · pack（zip + sha256 边车 + build-info）
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 pack

      - name: 交棒：dist/ 传给发布 job（演练通道它就是最终产出）
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/LiveTranslate-*.zip
            dist/LiveTranslate-*.zip.sha256
            dist/build-info.txt
          if-no-files-found: error
          overwrite: true                                        # 整链重跑时不撞同名 409
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}   # 演练产物短期可取

      # 手动触发 = 演练：在运行摘要末尾写清「什么都没发布 + 正式通道怎么走」
      - name: 演练结论（写进运行摘要）
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          @'

          ---

          ## 演练完成：没有创建 / 修改任何 Release

          check → build → pack 三步全绿，zip 在本次运行的 Artifacts（`release-dist`）里。

          > 演练有意跳过两道闸——「提交在 main 上」「该提交 ci 已绿」：它们只在正式（tag）通道生效。

          正式发布走 tag 通道：

          1. 确认 `Cargo.toml` 版本 = 要发的版本，且该提交已推上 main、ci 已绿；
          2. `git tag vX.Y.Z` 与 `git push origin vX.Y.Z` → 自动跑正式通道，全绿后 Releases 里出现【草稿】；
          3. 在 Releases 页面点草稿的 **Publish release** —— CI 永远不会替你点这一下。
          '@ >> $env:GITHUB_STEP_SUMMARY

  publish:
    name: 建草稿（不会发布；转正永远人工）
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write           # 建草稿 / 传资产 / 回读下载
    steps:
      - name: Checkout（取引擎脚本）
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 接棒：取回 dist/
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: 引擎 · draft（核对 tag ↔ 本提交 → 建/刷新草稿 → 上传）
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 draft

      - name: 引擎 · verify（回读 zip 与边车比对 sha256）
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 verify
