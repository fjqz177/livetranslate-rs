# LiveTranslate-rs CI——主干质量门禁（D-88 重构 + D-89 触发面回摆；细节真源 = 本文 + scripts/precommit.ps1 头注）
#
# 本文件只做一件事：质量门禁 + 全量测试 + 分发演练。
# 发布另有 release.yml（tag→Draft Release），依赖安全另有 security.yml（cargo-deny）。
#
# 门禁不手抄（A1）：第一步原样执行 scripts/precommit.ps1（fmt+五守护+clippy 七项）——
# 「本地过关 ⇔ CI 过关」由同一脚本保证，清单真源 = precommit.ps1 头注（CI 侧不复述）。
#
# 触发面（J1 回摆，D-89）：push 全分支 + pull_request + 手动三路。
#   回摆原因：仓库 2026-09-09 起是公开仓（fork/issue 均开），J1「私有 + 单人主干直推，
#   PR 触发是死配置」的前提已失效；缺 PR 触发 = 外部 PR 零检查。
#   双跑治理（旧版 P2-1）：两路归一到「源仓 + 源分支」并发组——本仓 PR 与其分支 push 落
#   同组互斥（后到取消先到），fork PR 带 fork 前缀，不会误伤本仓同名分支（如 fork 的 main）。
#   另注：只写 branches 时 tag push 不触发本文件——打 tag 前的质量兜底 = 人工确认该 commit 已绿。
#
# 可复现性：依赖解析一律 --locked（C，Cargo.lock/uv.lock 是入库真源）；
# rust-cache cache-on-failure: true（D，修红期间不清缓存）；
# sherpa 缓存键只随 Cargo.lock——脚本内部按版本化文件名自判重下，脚本改动不再分裂缓存。
#
# ignored 探针（真模型/真网络）在 CI 保持跳过 = 离线纪律。
# windows-latest 仍浮动：OS 层漂移靠实机批次兜底，CI 绿 ≠ 干净机能跑（runner 自带 VC++）。
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一「源仓 + 源分支」互斥：pull_request 取 head repo + head_ref；push 事件前两段为空，
  # 退到本仓 + ref_name（分支名）——本仓 PR 与其分支 push 因此同组，不双跑（旧版 P2-1）。
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gate-and-build:
    name: 门禁（precommit 七项整脚本）+ 测试 + 分发演练
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 以下工具链/缓存四步与 release.yml 镜像——改动须两文件同步（三次法则：第三处出现再抽 composite action）
      # K：第三方 action 全 SHA 钉版 + 版本注释（dependabot 接管升版）
      - name: Setup uv（仓库内 libclang/cmake 分发器）
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0（该仓无浮动大标签）

      - name: Sync pinned toolchain (libclang + cmake via uv)
        run: uv sync --locked

      - name: Cache sherpa-onnx prebuilt libs
        uses: actions/cache@v6
        with:
          path: .cache/sherpa-onnx
          key: sherpa-${{ hashFiles('Cargo.lock') }}
          restore-keys: sherpa-

      - name: Fetch sherpa-onnx libs
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/fetch_sherpa_libs.ps1

      - name: Cache Rust build (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          # shared-key（D-88 复审）：默认键含 job id，跨 job/workflow 永不共享——置稳定键后
          # release.yml 同名共享主干缓存（源码实证：shared-key 存在即完全替代 job-based key，
          # 无需动 add-job-id-key）；键仍含 Cargo.toml/lock + 工具链 hash，锁/链变更自动 miss
          shared-key: lt
          # 候选：save-if 只在 main 存缓存（ruff 式）——PR 流量大时再开

      - name: Precommit gate（七项整脚本 = 唯一门禁真源，与本地同源）
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/precommit.ps1

      - name: Test workspace
        run: cargo test --workspace --locked
        # 候选 H（nextest）待验收后替换为两行：
        #   cargo nextest run --workspace --locked   （taiki-e/install-action 装 nextest）
        #   cargo test --doc  --workspace --locked   （nextest 不跑 doctest，须补跑）
        # 首跑盯进程隔离差异：nextest 每测一进程，共享状态类测试可能翻出新问题。

      - name: Build release single exe
        run: cargo build --release -p lt-app --locked

      - name: Smoke release exe (--version)
        # WD-2 旗标零初始化短路——证明产物真能启动
        run: .\target\release\livetranslate.exe --version

      - name: Package distribution zip (WD-1)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package_release.ps1

      - name: Upload distribution zip
        uses: actions/upload-artifact@v7
        with:
          name: LiveTranslate-windows-x64
          path: dist/LiveTranslate-*.zip
          if-no-files-found: error
          # 配额保护（D-88 复审）：76MB × 30 天，非主干 3 天——分支演练产物短期可取，main 留档
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
