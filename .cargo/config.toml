
[env]
# whisper-rs-sys 的 bindgen 需要 libclang：由 uv 管理（仓库根 pyproject.toml 钉版
# libclang==18.1.1），首次构建前执行 `uv sync` 生成 .venv（见 uv.lock）。
# relative=true 使路径相对本配置文件所在目录解析（零机器相关绝对路径）；force=true
# 覆盖系统残留的 LIBCLANG_PATH（clang-sys 对已设变量只搜该目录，残留会短路内置搜索）
LIBCLANG_PATH = { value = ".venv/Lib/site-packages/clang/native", relative = true, force = true }
# whisper-rs-sys 构建 vendored whisper.cpp 走 cmake crate，默认在 PATH 找 cmake。
# 改为用仓库内 .venv 里 uv 钉版的那份（pyproject.toml dev 组 cmake==4.4.3）——
# cmake crate 的 cmake_executable() 优先读 CMAKE 环境变量（cmake-0.1.58 lib.rs:900-903），
# 设此变量即可免装系统 CMake。实测该路径走 VS 2022 生成器（不依赖 ninja）。
CMAKE = { value = ".venv/Scripts/cmake.exe", relative = true, force = true }
# sherpa-onnx-sys 构建期默认自己解包预编译静态库到 <target>/sherpa-onnx-prebuilt/（1.1GB），
# 两个问题：① 产物在 target/ 里 → 被 rust-cache 的清理规则删掉（非 cargo 结构文件一律 rm），
# 缓存恢复后只剩空目录而 build.rs 的 is_dir() 守卫照样放行 → 链接期 could not find native
# static library（2026-09-15 CI 实锤）；② cargo clean 即丢，重建要重解包 ~3 分钟。
# 改为预解包到仓库内 .cache/sherpa-onnx/extracted（gitignore；先跑 scripts/fetch_sherpa_libs.ps1，
# GitHub 慢可用 -Mirror <前缀>）并让 build.rs 命中即返回：全程零联网、不依赖 target/ 缓存。
# build.rs 已声明 rerun-if-env-changed=SHERPA_ONNX_LIB_DIR，链/设置变更会自动重跑。
SHERPA_ONNX_LIB_DIR = { value = ".cache/sherpa-onnx/extracted/lib", relative = true, force = true }
# whisper.cpp CRT 对齐（M5.1 双栈链接）：sherpa-onnx-sys 为预编译静态库（静态 CRT /MT
# 内嵌），whisper.cpp 走 cmake 默认 /MD 会在最终链接拉入 msvcprt.lib 与 sherpa 内嵌
# CRT 定义冲突（LNK2005/LNK1169）。统一为静态 CRT（whisper-rs-sys build.rs 透传
# 全部 CMAKE_* 环境变量；CMP0091 默认 OLD，需显式 NEW 才使 MSVC_RUNTIME_LIBRARY 生效）
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
